version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # "chore(deps): bump ..." passes the PR-title check. release-please
    # opens a release for feat, fix and deps commits only, so a chore never
    # causes one: right for a bump that changes no image, as here. The
    # bumps that do change one are "fix(deps)" below (docs/PLAN.md 9.1).
    commit-message:
      prefix: chore
      include: scope

  # The hashed pip-compile lockfile (requirements.in -> requirements.txt) for ruff.
  # Semgrep and Trivy versions live in strange_security, whose own Dependabot
  # keeps them current.
  - package-ecosystem: pip
    directory: /.github/lint
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope

  # core/Dockerfile's base images, pinned by digest. The FFmpeg source tarball
  # is not something Dependabot can see; ffmpeg-watch.yml covers it.
  - package-ecosystem: docker
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # fix, not chore: this bump changes a published image, and only a
    # releasable commit makes release-please propose the release that
    # ships it (docs/PLAN.md 9.1).
    commit-message:
      prefix: fix
      include: scope
    ignore:
      # The core targets Python 3.12 (CLAUDE.md), so only the digest of the
      # 3.12 tag moves; a newer Python is a decision, not a bump.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # The fetcher's hashed pip-compile lockfile (fetcher/requirements.in ->
  # requirements.txt). One group, so yt-dlp and the yt-dlp-ejs version it
  # pins move in one PR; the in-image tests fail if they ever disagree.
  - package-ecosystem: pip
    directory: /fetcher
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # fix, not chore: this bump changes a published image, and only a
    # releasable commit makes release-please propose the release that
    # ships it (docs/PLAN.md 9.1).
    commit-message:
      prefix: fix
      include: scope
    groups:
      ytdlp:
        patterns:
          - yt-dlp
          - yt-dlp-ejs

  # fetcher/Dockerfile's base images, pinned by digest: the Python base it
  # shares with the core and the named Deno stage.
  - package-ecosystem: docker
    directory: /fetcher
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # fix, not chore: this bump changes a published image, and only a
    # releasable commit makes release-please propose the release that
    # ships it (docs/PLAN.md 9.1).
    commit-message:
      prefix: fix
      include: scope
    ignore:
      # Python 3.12 only (CLAUDE.md), as for the core.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # The SBOM generator publish.yml hands to BuildKit, pinned by digest in a
  # Dockerfile that is never built, so this ecosystem can bump it. It is
  # in no image, so its bump is a chore.
  - package-ecosystem: docker
    directory: /.github/sbom
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
