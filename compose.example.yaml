# A hardened example of running the core (docs/PLAN.md 5.7) and, optionally,
# the fetcher with its forwarder (section 6). Copy it into your own
# infrastructure repository and adapt it there; this repository stays generic,
# so it names no deployment's host, domain or reverse proxy.
#
#   cp .env.example .env    # then set PUBLIC_ORIGIN
#   docker compose -f compose.example.yaml up -d core
#   docker compose -f compose.example.yaml up -d    # with the fetcher too
#
# `docker compose -f compose.example.yaml up -d fetcher` also starts
# `fetcher-forwarder`, which the fetcher depends on: a second command of the
# fetcher image, and the only service with a route out.
#
# The services publish no ports. A reverse proxy that terminates TLS joins
# the `core` network and forwards to core:8080. With the fetcher, the proxy
# also joins the `fetcher` network and forwards paths under /fetch/ to
# fetcher:8080 unchanged, on the same origin, and everything else to the core.
# The proxy must be a container attached to those networks: they give the
# Docker host no address (see Networks below), so a proxy running on the
# host itself, or with `network_mode: host`, can't reach core or fetcher.
#
# Networks: `core`, `fetcher` and `egress` are internal, with no route out,
# and isolated from the Docker host: `internal: true` alone still gives the
# host an address on each bridge, through which a container reaches every
# service the host listens on (SSH, admin ports), so these networks also set
# `gateway_mode_ipv4: isolated`, which leaves the bridge without one. `egress`
# is now the internal link between the fetcher and its forwarder (it used to
# be the fetcher's way out); `outside` is the one network with a route out,
# and only the forwarder joins it. This needs Docker Engine 28.0 or newer:
# older engines forward DNS queries from internal networks to the host's
# resolvers (CVE-2024-29018, fixed in 26.0), so the fetcher could resolve
# external names, and 28.0 is the release whose bridge driver accepts the
# `isolated` gateway mode on an internal network (moby/moby#49262).
#
# Logs: every service rotates its json-file log (`logging:` below). The
# Docker daemon doesn't rotate by default, and the forwarder logs every
# refusal, so an unrotated log could fill the host's disk.

name: strange_ringtone

services:
  core:
    # Deployments pin a released image by digest, for example
    #   image: ghcr.io/strangebasisdevs/strange_ringtone@sha256:<digest>
    # There is no release before v0.1.0, so this example builds the checkout.
    build:
      context: .
      dockerfile: core/Dockerfile
    image: strange_ringtone:local
    # PUBLIC_ORIGIN (required) and any optional settings, from .env.
    env_file: .env
    # The contract's fixed, non-root UID and GID; the image sets the same.
    user: "10001:10001"
    # Nothing in the image is writable but the tmpfs below, so a compromised
    # server can't change its own code or ffmpeg.
    read_only: true
    # The server needs no capability, and setuid binaries can't grant one.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Docker otherwise mounts a writable /dev/shm tmpfs and lets the server
    # create POSIX message queues under /dev/mqueue, both outside read_only.
    # The server uses neither, so /tmp stays the only writable path.
    ipc: none
    ulimits:
      msgqueue: 0
    tmpfs:
      # The only writable path: uploads and results, gone on restart. noexec
      # and nosuid keep anything written there from running. The size follows
      # the contract's formula (docs/PLAN.md 5.7): 64 MB fits the default
      # settings; MAX_CLIP_SECONDS=40 needs 84 MB.
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    networks:
      - core
    # json-file with rotation: Docker keeps every line forever unless the
    # daemon or the service sets max-size, so a flood of refusals could fill
    # the host's disk. 3 x 10 MB per container at most.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      # http.client to loopback: inside the container, with no proxy lookup.
      test:
        - CMD
        - python
        - -I
        - -c
        - "import http.client as h; c = h.HTTPConnection('127.0.0.1', 8080, timeout=3); c.request('GET', '/healthz'); raise SystemExit(c.getresponse().status != 200)"
      interval: 30s
      timeout: 5s
      retries: 3
    # For local development only, never on a LAN-facing host: publish the
    # port on loopback and set PUBLIC_ORIGIN=http://127.0.0.1:8080 in .env.
    # An internal network has no port publishing, so also switch `core`
    # below to a normal network, and drop its `driver_opts`, while you do:
    # Docker refuses the isolated gateway mode on a network that isn't
    # internal.
    # ports:
    #   - "127.0.0.1:8080:8080"

  fetcher:
    # Optional: only for YouTube links, and only with FETCH_ENABLED=true for
    # the core. Deployments pin a released image by digest, for example
    #   image: ghcr.io/strangebasisdevs/strange_ringtone-fetcher@sha256:<digest>
    build:
      context: .
      dockerfile: fetcher/Dockerfile
    image: strange_ringtone-fetcher:local
    # The same .env: PUBLIC_ORIGIN and TRUSTED_PROXIES are shared, and the
    # fetcher reads its FETCH_* settings.
    env_file: .env
    environment:
      # Set here, not in .env, because the example's point is that yt-dlp can
      # leave only through the forwarder: a service's `environment` wins over
      # its env_file, so an HTTPS_PROXY in .env is overridden.
      HTTPS_PROXY: http://fetcher-forwarder:3128
    # The same hardening as the core.
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ipc: none
    ulimits:
      msgqueue: 0
    tmpfs:
      # One download in flight and one uncollected result, plus the info
      # JSON and Deno's cache: 2 x FETCH_MAX_BYTES + 16 MB (96 MB with the
      # defaults). noexec: nothing downloaded can be run.
      - /tmp:rw,noexec,nosuid,size=96m,mode=1777
    # prlimit bounds yt-dlp's CPU time, file size, open files and processes,
    # but not its address space, because Deno reserves a huge virtual range
    # at startup. This cgroup limit is what bounds the fetcher's memory.
    mem_limit: 512m
    # Internal networks only, so the fetcher has no default route and its
    # DNS resolves service names but no external name; it refuses to start
    # where it finds a default route (FETCH_ALLOW_DEFAULT_ROUTE). `fetcher`
    # for the reverse proxy to reach it; `egress` for the forwarder and
    # nothing else, yt-dlp's only way out. Not on `core`: the fetcher never
    # calls the core, and a separate network means a compromised fetcher
    # can't reach it either. Until the runner split (docs/PLAN.md 6.1, PR B),
    # yt-dlp, yt-dlp-ejs and Deno run inside this container: on `fetcher`
    # beside the reverse proxy (they can reach every port it listens on
    # there, and through it the app's origin and the core), as the UID that
    # owns the fetcher's /tmp job directories and results, and able to read
    # the server's environment. This layout alone doesn't keep third-party
    # code off the proxy or out of the app's requests and responses.
    networks:
      - fetcher
      - egress
    # `up -d fetcher` brings the forwarder up too, so yt-dlp's proxy is there.
    depends_on:
      - fetcher-forwarder
    # json-file with rotation: Docker keeps every line forever unless the
    # daemon or the service sets max-size, so a flood of refusals could fill
    # the host's disk. 3 x 10 MB per container at most.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -I
        - -c
        - "import http.client as h; c = h.HTTPConnection('127.0.0.1', 8080, timeout=3); c.request('GET', '/fetch/healthz'); raise SystemExit(c.getresponse().status != 200)"
      interval: 30s
      timeout: 5s
      retries: 3

  fetcher-forwarder:
    # The fetcher's only way out (docs/PLAN.md 6.1): a stdlib CONNECT gate on
    # port 3128 that allows port 443 to youtube.com, its subdomains and the
    # subdomains of googlevideo.com, decides everything before DNS, resolves
    # IPv4 only and connects only to global unicast addresses it checked.
    # The fetcher image with another command, so one pinned digest serves
    # both services.
    build:
      context: .
      dockerfile: fetcher/Dockerfile
    image: strange_ringtone-fetcher:local
    command:
      - python
      - -I
      - /app/fetcher/forwarder.py
    # No env_file and no environment: the forwarder reads no setting, so
    # nothing in .env can widen what it allows.
    # The same hardening as the core and the fetcher.
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ipc: none
    ulimits:
      msgqueue: 0
    # No tmpfs: the forwarder writes nothing, so nothing in it is writable.
    # Its own limits bound each tunnel (README); this bounds the process.
    mem_limit: 128m
    # `egress` for the fetcher to reach it; `outside` for its route out. Not
    # on `fetcher` or `core`, so a compromised forwarder reaches neither the
    # core nor the reverse proxy. Until PR B (docs/PLAN.md 6.1) it shares
    # `egress` with the fetcher, which listens on all its interfaces, so it
    # can reach the fetcher's port 8080 there, where the fetcher's Origin and
    # rate checks still apply. It listens on 3128 on all its interfaces,
    # `outside` included, where the Docker host itself can reach it (Engine
    # 28 and newer drop direct routing to unpublished ports from elsewhere):
    # nothing but the forwarder may join `outside`, and nothing on the host
    # should use that port.
    networks:
      - egress
      - outside
    # json-file with rotation: Docker keeps every line forever unless the
    # daemon or the service sets max-size, so a flood of refusals could fill
    # the host's disk. 3 x 10 MB per container at most.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    healthcheck:
      # A TCP connect to loopback and nothing sent: the forwarder neither
      # answers nor logs a connection closed before its first byte.
      test:
        - CMD
        - python
        - -I
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 3128), timeout=3).close()"
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  core:
    # internal: no route out of this network. The core never makes an
    # outbound connection, so it needs none.
    internal: true
    # isolated: the bridge gets no address on the Docker host, so nothing on
    # this network reaches the host's own services either (internal: true
    # alone leaves the host reachable through the bridge's gateway address).
    # Container-to-container traffic and service names work as before, but
    # the host has no route to the containers here: the reverse proxy must
    # be a container on this network, not a process on the host.
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  fetcher:
    # Between the proxy and the fetcher only, with no route out of its own,
    # and isolated from the host as `core` is.
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  egress:
    # Between the fetcher and the forwarder only: no route out, no external
    # DNS (Engine 26.0 and newer) and no address on the host (the isolated
    # gateway mode, Engine 28.0 and newer), so the forwarder is the fetcher's
    # one way out.
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  outside:
    # The one network with a route out, for the forwarder only, so it keeps
    # its gateway (the route out goes through it). The core and the fetcher
    # never join it.
    internal: false
